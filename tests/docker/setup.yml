---
# Setup for Docker tests
- name: Install Docker
  ansible.builtin.apt:
    name:
      - docker.io
      - python3-docker
    state: present

- name: Ensure Docker config directory exists
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    mode: "0755"

- name: Configure daemon.json to disable containerd snapshotter
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: |
      {
        "features": {
          "containerd-snapshotter": false
        },
        "storage-driver": "overlay2"
      }
    mode: "0644"
  register: docker_daemon_config

- name: Restart Docker immediately
  ansible.builtin.systemd:
    name: docker
    state: restarted
    daemon_reload: true
  when: docker_daemon_config.changed

- name: Start Docker service
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true

- name: Create running containers with health checks
  community.docker.docker_container:
    name: "{{ item.name }}"
    image: "{{ item.image }}"
    state: started
    healthcheck:
      test: "{{ item.healthcheck }}"
      interval: 10s
      timeout: 5s
      retries: 3
  loop:
    - name: test-nginx-healthy
      image: nginx:alpine
      healthcheck:
        ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost"]
    - name: test-redis-healthy
      image: redis:alpine
      healthcheck: ["CMD", "redis-cli", "ping"]
  register: container_result
  retries: 3
  delay: 5
  until: container_result is not failed

- name: Create running container without health check
  community.docker.docker_container:
    name: test-busybox-running
    image: busybox:latest
    state: started
    command: sleep 3600

- name: Create stopped container
  community.docker.docker_container:
    name: test-nginx-stopped
    image: nginx:alpine
    state: started

- name: Stop the container
  community.docker.docker_container:
    name: test-nginx-stopped
    state: stopped

- name: Create paused container
  community.docker.docker_container:
    name: test-alpine-paused
    image: alpine:latest
    state: started
    command: sleep 3600

- name: Check if container is already paused
  ansible.builtin.shell: docker inspect -f '{% raw %}{{.State.Paused}}{% endraw %}' test-alpine-paused
  register: container_paused
  changed_when: false
  failed_when: false

- name: Pause the container
  ansible.builtin.command: docker pause test-alpine-paused
  when: container_paused.stdout != "true"
  changed_when: false

- name: Wait for healthy containers
  ansible.builtin.pause:
    seconds: 15
